let products=[],ads=[],settings={},brand='all',limit=24,adIndex=0,cacheMode=false,refreshing=false;
let selectedId=null,ownModalEntry=false,lastDetailFocus=null,shareItem=null,adTimer=null,adPaused=false;
const modalMarker='catalog-detail-v2.1';
const money=new Intl.NumberFormat('ar-YE',{maximumFractionDigits:0});
function priceLabel(p){const n=priceNumber(p);return n===null?'السعر عند الاستفسار':'$'+n.toLocaleString('en-US',{maximumFractionDigits:2});}
function yer(p){const n=priceNumber(p),rate=Number(settings.exchangeRate);return n!==null&&rate>0?money.format(n*rate)+' ريال':'';}
function loading(){const f=document.createDocumentFragment();for(let i=0;i<8;i++)f.append(el('div',undefined,'card skeleton'));$('grid').replaceChildren(f);}
function accept(j,cached){products=j.items.filter(p=>String(p.brand).trim()!=='إعلان').reverse();ads=j.items.filter(p=>String(p.brand).trim()==='إعلان');settings=j.settings||{};cacheMode=cached;drawBrands();drawAds();startAds();apply();}
async function load(){if(refreshing)return;refreshing=true;$('refresh').disabled=true;$('grid').setAttribute('aria-busy','true');if(!products.length)loading();$('status').textContent='';try{const url=endpoint(API_URL),j=await api(url);accept(j,false);try{localStorage.setItem('catalog-v2:'+url,JSON.stringify({...j,savedAt:new Date().toISOString()}));}catch{}$('status').textContent='';syncDetail();}catch(e){let cached=null;try{cached=JSON.parse(localStorage.getItem('catalog-v2:'+endpoint(API_URL)));}catch{}if(cached&&cached.apiVersion===2&&Array.isArray(cached.items)){accept(cached,true);$('status').textContent=e.message+' — تعرض نسخة محفوظة بتاريخ '+new Date(cached.savedAt).toLocaleString('ar-YE')+'؛ أكّد السعر والتوفر.';syncDetail();}else if(products.length){cacheMode=true;$('status').textContent=e.message+' — لم يتم تحديث الأسعار المعروضة.';syncDetail();}else{$('grid').replaceChildren(el('div','تعذر تحميل الكتالوج. اضغط «تحديث البيانات» للمحاولة مجددًا.','panel empty'));$('count').textContent='الكتالوج غير متاح مؤقتًا';$('status').textContent=e.message;}}finally{refreshing=false;$('refresh').disabled=false;$('grid').setAttribute('aria-busy','false');}}
function drawBrands(){const frag=document.createDocumentFragment();['all',...new Set(products.map(p=>String(p.brand).trim()).filter(Boolean))].forEach(b=>{const n=button(b==='all'?'كل الشركات':b,()=>{brand=b;limit=24;drawBrands();apply();},b===brand?'selected':'');n.setAttribute('aria-pressed',String(b===brand));frag.append(n);});$('brands').replaceChildren(frag);}
function drawAds(){const box=$('ad');box.hidden=!ads.length;if(!ads.length){box.replaceChildren();return;}adIndex%=ads.length;const a=ads[adIndex],frame=el('div',undefined,'ad-frame ad-enter');frame.append(el('p',a.name||'إعلان'));if(a.img1)frame.append(image(a.img1,'صورة الإعلان'));box.replaceChildren(frame);}
function stopAds(){if(adTimer!==null){clearInterval(adTimer);adTimer=null;}}
function startAds(){stopAds();if(ads.length<2||adPaused||document.hidden)return;adTimer=setInterval(()=>{adIndex=(adIndex+1)%ads.length;drawAds();},Math.max(2000,Number(ADS_INTERVAL_MS)||4000));}
function apply(){const term=normalize($('search').value),raw=$('budget').value,budget=raw===''?null:Number(raw),rate=Number(settings.exchangeRate);let list=products.filter(p=>(brand==='all'||String(p.brand).trim()===brand)&&(!term||normalize(p.name+' '+p.brand+' '+p.storage).includes(term))&&($('offerOnly').value!=='yes'||p.isOffer==='نعم')&&(budget===null||(budget>=0&&rate>0&&priceNumber(p)!==null&&priceNumber(p)*rate<=budget)));
if($('sort').value==='low')list.sort((a,b)=>(priceNumber(a)??Infinity)-(priceNumber(b)??Infinity));if($('sort').value==='high')list.sort((a,b)=>(priceNumber(b)??-Infinity)-(priceNumber(a)??-Infinity));if($('sort').value==='name')list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
$('count').textContent=money.format(list.length)+' جوال';const frag=document.createDocumentFragment();list.slice(0,limit).forEach((p,i)=>{const card=el('article',undefined,'card'),open=button('',()=>openDetail(p.id),'product-open');open.setAttribute('aria-label','عرض تفاصيل '+p.name);open.append(image(p.img1,p.name,i>=4),el('h2',p.name||'جوال'),el('div',p.storage||p.brand||'','muted small'),el('div',priceLabel(p),'price'));const yp=yer(p);if(yp)open.append(el('div',yp,'yer-price'));card.append(open);if(p.isOffer==='نعم'){card.classList.add('offer-card');card.append(el('span','عرض خاص','badge offer-badge'));}const foot=el('div',undefined,'card-foot');const details=button('تفاصيل الجهاز',()=>openDetail(p.id),'details-button');details.setAttribute('aria-label','تفاصيل الجهاز '+p.name);foot.append(details);const share=button('مشاركة',()=>shareProduct(p),'share-card');share.setAttribute('aria-label','مشاركة '+p.name);foot.append(share);card.append(foot);frag.append(card);});if(!list.length)frag.append(el('div','لا توجد جوالات مطابقة. جرّب مسح الفلاتر.','panel empty'));$('grid').replaceChildren(frag);$('more').hidden=list.length<=limit;}

function webPage(){return /^https?:$/.test(location.protocol);}
function queryProductId(){try{return new URL(location.href).searchParams.get('id');}catch{return null;}}
function productUrl(p){let base='';if(webPage())base=location.href;else if(PUBLIC_STORE_URL)base=PUBLIC_STORE_URL;else return '';try{const u=new URL(base);if(!/^https?:$/.test(u.protocol)||!u.hostname||u.username||u.password)return '';u.searchParams.set('id',String(p.id));return u.href;}catch{return '';}}
function sharePayload(p){const url=productUrl(p);const text='📱 '+p.name+'\n💰 السعر: '+priceLabel(p)+(yer(p)?' ('+yer(p)+')':'');const data={title:String(p.name||'جوال'),text};if(url)data.url=url;return data;}
function shareText(p){const data=sharePayload(p);return data.text+(data.url?'\n🔗 '+data.url:'');}
function showModalSafe(d){if(!d.open){try{if(typeof d.showModal==='function'){d.showModal();}else throw new Error('Dialog fallback');}catch{d.setAttribute('open','');d.classList.add('fallback-open');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');}}document.body.classList.add('modal-open');$('modalShade').hidden=!document.querySelector('dialog.fallback-open[open]');}
function hideModalSafe(d){try{if(typeof d.close==='function'&&d.open)d.close();}catch{}d.removeAttribute('open');d.classList.remove('fallback-open');if(!document.querySelector('dialog[open]'))document.body.classList.remove('modal-open');$('modalShade').hidden=!document.querySelector('dialog.fallback-open[open]');}
function showShareOptions(p,message){shareItem=p;$('shareText').value=shareText(p);$('shareMessage').textContent=message||(!productUrl(p)?'يمكن مشاركة اسم الجوال وسعره الآن. لإرفاق رابط الجهاز، افتح النسخة المنشورة من المتجر.':'اختر طريقة المشاركة أو انسخ النص.');$('nativeShare').hidden=typeof navigator.share!=='function';$('shareWhatsApp').href='https://wa.me/?text='+encodeURIComponent(shareText(p));showModalSafe($('shareDialog'));}
function shareProduct(p){shareItem=p;const data=sharePayload(p);if(typeof navigator.share==='function'){try{Promise.resolve(navigator.share(data)).catch(e=>{if(e.name!=='AbortError')showShareOptions(p);});}catch{showShareOptions(p);}}else showShareOptions(p);}
async function copyText(text){try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);return true;}catch{try{const input=el('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';const host=$('shareDialog').open?$('shareDialog'):$('detail').open?$('detail'):document.body;host.append(input);input.focus();input.select();const ok=typeof document.execCommand==='function'&&document.execCommand('copy');input.remove();return Boolean(ok);}catch{return false;}}}
async function copyProduct(p){const url=productUrl(p);if(!url){showShareOptions(p);return;}if(await copyText(url))toast('تم نسخ رابط الجوال.');else showShareOptions(p,'تعذر النسخ التلقائي. اضغط مطولًا على النص لنسخه.');}
function renderDetail(p){const layout=el('div',undefined,'detail-layout'),left=el('div'),mainImg=image(p.img1,p.name,false);mainImg.className='detail-img';left.append(mainImg);const thumbs=el('div',undefined,'thumbs');[p.img1,p.img2].filter(Boolean).forEach((src,i)=>{const b=button('',()=>{const im=image(src,p.name,false);mainImg.src=im.src;});b.setAttribute('aria-label','عرض الصورة '+(i+1));b.append(image(src,'الصورة '+(i+1)));thumbs.append(b);});left.append(thumbs);const right=el('div'),h=el('h2',p.name);h.id='detailTitle';right.append(h,el('div',priceLabel(p),'price'),el('div',yer(p),'yer-price'));if(p.descript){const desc=el('p',p.descript);desc.style.whiteSpace='pre-line';right.append(desc);}const dl=el('dl',undefined,'specs');[['الشركة','brand'],['المعالج','cpu'],['التخزين / الرام','storage'],['الكاميرا','cam'],['الشاشة','screen'],['نظام التشغيل','os'],['البطارية','battery'],['الشبكات','net']].forEach(([label,k])=>{if(p[k]){const row=el('div');row.append(el('dt',label),el('dd',p[k]));dl.append(row);}});right.append(dl);const order=el('a','استفسر عن الجهاز عبر واتساب','button success');const u=productUrl(p);order.href='https://wa.me/967770418837?text='+encodeURIComponent('مرحبًا، أود الاستفسار عن: '+p.name+'\nالمعرّف: '+p.id+'\nالسعر المعروض: '+priceLabel(p)+(u?'\n'+u:''));order.target='_blank';order.rel='noopener noreferrer';const actions=el('div',undefined,'actions');actions.append(button('مشاركة',()=>shareProduct(p)),button('نسخ الرابط',()=>copyProduct(p)));right.append(order,actions);layout.append(left,right);$('detailContent').replaceChildren(layout);showModalSafe($('detail'));}
function openDetail(id){const p=products.find(x=>String(x.id)===String(id));if(!p){toast('الجوال المطلوب غير موجود.');return;}lastDetailFocus=document.activeElement;selectedId=String(p.id);renderDetail(p);if(!webPage())return;try{const u=new URL(location.href);if(u.searchParams.get('id')!==selectedId){u.searchParams.set('id',selectedId);history.pushState({catalogModal:modalMarker,catalogId:selectedId},'',u.href);ownModalEntry=true;}}catch{ownModalEntry=false;/* History failure must never prevent viewing a product. */}}
function closeDetail(){hideModalSafe($('shareDialog'));hideModalSafe($('detail'));selectedId=null;if(webPage()){try{if(ownModalEntry&&history.state?.catalogModal===modalMarker){ownModalEntry=false;history.back();}else{const u=new URL(location.href);if(u.searchParams.has('id')){u.searchParams.delete('id');history.replaceState(null,'',u.href);}}}catch{ownModalEntry=false;}}try{lastDetailFocus?.focus({preventScroll:true});}catch{}}
function syncDetail(fromHistory=false){if(fromHistory){hideModalSafe($('shareDialog'));selectedId=queryProductId();ownModalEntry=Boolean(webPage()&&history.state?.catalogModal===modalMarker);}else if(selectedId===null)selectedId=queryProductId();if(selectedId===null){hideModalSafe($('detail'));return;}const p=products.find(x=>String(x.id)===String(selectedId));if(p)renderDetail(p);else if(products.length){hideModalSafe($('detail'));selectedId=null;toast('الجوال المطلوب غير موجود أو تم حذفه.');}}
function resetFilters(){brand='all';$('search').value='';$('budget').value='';$('sort').value='new';$('offerOnly').value='all';limit=24;drawBrands();apply();}
function toggleFilters(force){const open=typeof force==='boolean'?force:$('filters').hidden;$('filters').hidden=!open;$('toggleFilters').setAttribute('aria-expanded',String(open));}
$('search').addEventListener('input',()=>{limit=24;apply();});['budget','sort','offerOnly'].forEach(id=>$(id).addEventListener('input',()=>{limit=24;apply();}));$('toggleFilters').onclick=()=>toggleFilters();$('categories').onclick=()=>{toggleFilters(true);$('filters').scrollIntoView({behavior:'smooth',block:'center'});};$('clear').onclick=resetFilters;$('home').onclick=$('homeTop').onclick=()=>{resetFilters();toggleFilters(false);window.scrollTo({top:0,behavior:'smooth'});};$('offers').onclick=()=>{$('offerOnly').value=$('offerOnly').value==='yes'?'all':'yes';limit=24;apply();};$('more').onclick=()=>{limit+=24;apply();};$('refresh').onclick=load;$('closeDetail').onclick=closeDetail;$('detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});$('closeShare').onclick=()=>hideModalSafe($('shareDialog'));$('shareDialog').addEventListener('cancel',e=>{e.preventDefault();hideModalSafe($('shareDialog'));});$('nativeShare').onclick=()=>{if(shareItem)shareProduct(shareItem);};$('copyShare').onclick=async()=>{if(await copyText($('shareText').value))toast('تم نسخ نص المشاركة.');else{$('shareText').focus();$('shareText').select();$('shareMessage').textContent='اضغط مطولًا على النص المحدد واختر نسخ.';}};$('modalShade').onclick=()=>{if($('shareDialog').open)hideModalSafe($('shareDialog'));else closeDetail();};window.addEventListener('popstate',()=>syncDetail(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAds();else startAds();});$('ad').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){adPaused=true;stopAds();}});$('ad').addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){adPaused=false;startAds();}});window.addEventListener('pagehide',stopAds);window.addEventListener('pageshow',startAds);load();
</script></body></html>
