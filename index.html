<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالم التكنولوجيا | أحدث الجوالات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --main-blue: #0066ff;
            --dark-blue: #0044aa;
            --body-bg: #f8f9fa;
        }

        body {
            background-color: var(--body-bg);
            font-family: 'Cairo', sans-serif;
            margin-bottom: 80px;
        }

        /* الهيدر المطور */
        .hero-header {
            background: linear-gradient(135deg, var(--main-blue), var(--dark-blue));
            padding: 40px 20px 30px;
            text-align: center;
            color: white;
            border-radius: 0 0 40px 40px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 102, 255, 0.1);
        }

        .shop-name {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.9;
        }

        .hero-desc {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        /* شريط البحث */
        .search-wrapper {
            max-width: 500px;
            margin: 0 auto;
        }

        .search-bar {
            background: white;
            border-radius: 15px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            margin-right: 10px;
            font-size: 0.95rem;
        }

        .search-bar i { color: var(--main-blue); }

        /* بنر العروض */
        .promo-banner {
            background: #fff;
            border-radius: 20px;
            margin: 20px 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            border: 1px solid #edf2f7;
            cursor: pointer;
            transition: 0.3s;
        }

        .promo-banner:active { transform: scale(0.98); }

        .promo-text h2 { font-size: 1.3rem; font-weight: 800; }
        .promo-text p { font-size: 0.85rem; color: #666; }

        /* شبكة المنتجات */
        .phone-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }

        .phone-card {
            background: white;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #f0f0f0;
            text-align: center;
            position: relative;
            transition: 0.3s;
        }

        .phone-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .phone-card h6 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            height: 40px;
            overflow: hidden;
        }

        .price-tag {
            color: var(--main-blue);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .share-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #f8f9fa;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.8rem;
        }

        /* القائمة السفلية */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #eee;
            z-index: 1050;
        }

        .nav-item {
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .nav-item.active { color: var(--main-blue); }
        .nav-item i { font-size: 1.3rem; display: block; margin-bottom: 2px; }

        @media (min-width: 992px) {
            .phone-grid { grid-template-columns: repeat(4, 1fr); }
            .bottom-nav { display: none; }
        }
    </style>
</head>
<body>

<header class="hero-header">
    <div class="shop-name">عالم التكنولوجيا</div>
    <div class="hero-subtitle">أحدث الجوالات العالمية</div>
    <div class="hero-desc">كل ما تحتاجه في عالم التكنولوجيا بين يديك</div>
    
    <div class="search-wrapper">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="phoneSearch" placeholder="ابحث عن اسم الجوال..." onkeyup="searchPhones()">
        </div>
    </div>
</header>

<div class="promo-banner" onclick="filterData('عروض')">
    <div class="promo-text flex-grow-1">
        <h2>عروض خاصة <i class="fas fa-fire text-danger"></i></h2>
        <p class="mb-2">توفير كبير على أفضل الأجهزة العالمية</p>
        <button class="btn btn-primary btn-sm rounded-pill px-4 fw-bold">اكتشف المزيد</button>
    </div>
    <div class="promo-img">
        <img src="https://www.apple.com/v/iphone/home/bu/images/overview/select/iphone_15_pro__dqdbbb8acyue_large.png" width="90">
    </div>
</div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2 text-muted">جاري تحميل أحدث المنتجات...</p>
</div>

<div id="productGrid" class="phone-grid"></div>

<div class="bottom-nav">
    <a href="#" class="nav-item active" onclick="location.reload()"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="#" class="nav-item" data-bs-toggle="offcanvas" data-bs-target="#brandMenu"><i class="fas fa-th-large"></i>الفئات</a>
    <a href="https://wa.me/967770418837" class="nav-item"><i class="fab fa-whatsapp"></i>واتساب</a>
    <a href="#" class="nav-item" onclick="filterData('عروض')"><i class="fas fa-fire text-danger"></i>العروض</a>
</div>

<div class="offcanvas offcanvas-start" id="brandMenu" style="width: 280px;">
    <div class="offcanvas-header bg-primary text-white">
        <h5 class="offcanvas-title">تصفح حسب الماركة</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0" id="brandList">
        <a href="#" class="list-group-item p-3 border-bottom d-block text-dark text-decoration-none fw-bold" onclick="filterData('all')" data-bs-dismiss="offcanvas">الكل</a>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down modal-dialog-centered">
        <div class="modal-content" id="modalBody" style="border-radius: 25px 25px 0 0;"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpNHg2pQVD0H6oelvpdtKXZWVs7BYskMe6nre5OIxHCdhWlNBEHv1YykCzVZCmezwWzw/exec?data=true";
    let allProducts = [];

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            allProducts = await res.json();
            renderBrands();
            renderProducts(allProducts);
            document.getElementById('loading').style.display = 'none';

            // تفعيل ميزة فتح المنتج من الرابط (Deep Link)
            checkDeepLink();
        } catch (e) {
            document.getElementById('loading').innerHTML = "تعذر الاتصال بالبيانات";
        }
    }

    function renderBrands() {
        const brands = [...new Set(allProducts.map(p => p.Brand))];
        const container = document.getElementById('brandList');
        brands.forEach(b => {
            if(b) container.innerHTML += `<a href="#" class="list-group-item p-3 border-bottom d-block text-dark text-decoration-none fw-600" onclick="filterData('${b}')" data-bs-dismiss="offcanvas">${b}</a>`;
        });
    }

    function renderProducts(products) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        products.forEach(p => {
            grid.innerHTML += `
                <div class="phone-card" onclick="showDetails('${p.ID}')">
                    <div class="share-btn" onclick="event.stopPropagation(); shareProduct('${p.ID}')">
                        <i class="fas fa-share-alt"></i>
                    </div>
                    <img src="${p.Image1 || 'https://via.placeholder.com/150'}">
                    <h6>${p.Name}</h6>
                    <span class="price-tag">$${p.Price}</span>
                </div>`;
        });
    }

    function filterData(brand) {
        let filtered = (brand === 'all') ? allProducts : 
                       (brand === 'عروض') ? allProducts.filter(p => p.IsOffer === "نعم") : 
                       allProducts.filter(p => p.Brand === brand);
        renderProducts(filtered);
        window.scrollTo(0,0);
    }

    function searchPhones() {
        const term = document.getElementById('phoneSearch').value.toLowerCase();
        renderProducts(allProducts.filter(p => p.Name.toLowerCase().includes(term)));
    }

    function showDetails(id) {
        const p = allProducts.find(x => x.ID == id);
        if(!p) return;
        document.getElementById('modalBody').innerHTML = `
            <div class="modal-body p-0">
                <div class="text-center p-4 bg-light position-relative">
                    <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
                    <img src="${p.Image1}" style="max-height: 280px; width: auto;">
                </div>
                <div class="p-4">
                    <h4 class="fw-800 mb-1">${p.Name}</h4>
                    <p class="text-muted small mb-3">ماركة: ${p.Brand}</p>
                    <h2 class="text-primary fw-bold mb-4">$${p.Price}</h2>
                    <div class="row g-2 mb-4 text-center">
                        <div class="col-4"><div class="bg-light p-2 rounded"><i class="fas fa-microchip d-block text-primary mb-1"></i><small>${p.Processor}</small></div></div>
                        <div class="col-4"><div class="bg-light p-2 rounded"><i class="fas fa-hdd d-block text-primary mb-1"></i><small>${p.Storage}</small></div></div>
                        <div class="col-4"><div class="bg-light p-2 rounded"><i class="fas fa-camera d-block text-primary mb-1"></i><small>${p.Camera}</small></div></div>
                    </div>
                    <div class="d-grid">
                        <a href="https://wa.me/967770418837?text=أريد طلب: ${p.Name}" class="btn btn-success btn-lg rounded-pill fw-bold">
                            <i class="fab fa-whatsapp me-2"></i> اطلب الآن
                        </a>
                    </div>
                </div>
            </div>`;
        new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    function shareProduct(id) {
        const p = allProducts.find(x => x.ID == id);
        // توليد رابط احترافي بناءً على رابط الموقع الحالي
        const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        const shortLink = `${baseUrl}?id=${id}`; 
        
        const text = `📱 *${p.Name}*\n💰 السعر: $${p.Price}\n🔗 التفاصيل: ${shortLink}`;
        
        if (navigator.share) {
            navigator.share({ title: p.Name, text: text, url: shortLink });
        } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
        }
    }

    function checkDeepLink() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        if (productId) {
            setTimeout(() => showDetails(productId), 500);
        }
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
